name: Static analysis
on:
  pull_request

permissions: {}
jobs:
  static-phpstan-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        php-versions: ['8.5']
        nextcloud: [ 'stable35' ]
        database: [ 'sqlite' ]
        include:
          - php-versions: 8.3
            nextcloud: stable35
            database: sqlite
            experimental: false
          - php-versions: 8.4
            nextcloud: stable33
            database: sqlite
            experimental: false
          - php-versions: 8.5
            nextcloud: stable34
            database: sqlite
            experimental: false
          - php-versions: 8.5
            nextcloud: pre-release
            database: sqlite
            experimental: true
          - php-versions: highest
            nextcloud: pre-release
            database: sqlite
            experimental: true
    name: "phpstan: Nextcloud ${{ matrix.nextcloud }} with ${{ matrix.php-versions }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_sqlite,pdo_mysql,pdo_pgsql,gd,zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up server non MySQL
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@1292f89b194f41cbba1a53086918ba6a71e73863 # 2026.10.26.1
        with:
          cron: true
          version: ${{ matrix.nextcloud }}
          database-type: ${{ matrix.database }}

      - name: Build app
        run: make composer

      - name: Configure server with app
        uses: SMillerDev/nextcloud-actions/setup-nextcloud-app@86ea139d16492bcec127944d7c21efd2269c763b # 2026.10.19.1
        with:
          app: 'news'
          check-code: false
          force: true

      - name: Prep code scanning
        working-directory: ../server/apps/news
        run: make php-test-dependencies

      - name: PHPCS
        working-directory: ../server/apps/news
        run: make phpcs

      - name: PHPStan
        working-directory: ../server/apps/news
        run: make phpstan
