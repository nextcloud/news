<div class="md-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
  {% if config.extra.build_commit %}
    &nbsp;&ndash;&nbsp;
    Built from commit
    <a href="https://github.com/nextcloud/news/commit/{{ config.extra.build_commit }}"
       target="_blank"
       rel="noopener noreferrer">
      {{ config.extra.build_commit }}
    </a>
  {% endif %}
</div>
